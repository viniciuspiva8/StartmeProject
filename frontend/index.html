<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>StartMe - Plataforma de empregabilidade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
</head>

<body>
  <div id="app">
    <!-- Preenchido por js/app.js + js/views.js. Se você está vendo esta mensagem
         com JavaScript desabilitado ou um script falhou ao carregar: abra o
         Console do navegador para ver o erro. -->
    <noscript>O StartMe precisa de JavaScript habilitado para funcionar.</noscript>
  </div>

  <!-- Endereços dos dois backends por ambiente. Troque aqui, não nos outros
       arquivos — mesmo padrão de coletor/web/index.html (window.STARTME_API_URL).
       Nenhum dos dois é obrigatório: se estiverem fora do ar, o frontend cai
       para os dados mock de js/mock-data.js (ver README.md). -->
  <script>
    window.STARTME_COLETOR_URL = "http://localhost:8000";
    window.STARTME_CADASTRO_URL = "http://localhost:3000";
  </script>

  <script src="js/mock-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
